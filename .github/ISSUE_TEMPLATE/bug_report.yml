name: Bug report
description: Report a reproducible problem without sharing personal files.
body:
  - type: markdown
    attributes:
      value: Please use synthetic files. Report security problems privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: File details and requirements
      description: Format, dimensions, size, selected options, and a non-sensitive error message.
